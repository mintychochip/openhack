[package]
name = "openhack-cli"
version = "0.1.0"
edition = "2021"
description = "OpenHack TUI installer and deployment tool"

[dependencies]
ratatui = "0.28"
crossterm = "0.28"
serde = { version = "1", features = ["derive"] }
toml = "0.8"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "process", "io-util", "sync"] }
reqwest = { version = "0.13", default-features = false, features = ["json", "rustls-tls"] }
serde_json = "1"
which = "6"
rand = "0.8"
chrono = { version = "0.4", features = ["serde"] }
thiserror = "1"
