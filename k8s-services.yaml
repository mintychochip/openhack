                secretKeyRef:
                  name: openhack-secrets
                  key: discord-bot-token
                  optional: true
            - name: DATABASE_URL
              value: "postgresql://$(POSTGRES_USER):$(DATABASE_PASSWORD)@$(POSTGRES_HOST):$(POSTGRES_PORT)/$(POSTGRES_DB)"
            - name: GATEWAY_URL
              value: "http://gateway-svc:8000"
            - name: SERVICE_PORT
              value: "3011"
          ports:
            - containerPort: 3011
          resources:
            requests:
              memory: 64Mi
              cpu: 50m
            limits:
              memory: 128Mi
              cpu: 200m
          readinessProbe:
            httpGet:
              path: /health
              port: 3011
            initialDelaySeconds: 15
            periodSeconds: 10
