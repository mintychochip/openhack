apiVersion: apps/v1
kind: Deployment
metadata:
  name: media-svc
spec:
  replicas: 1
  selector:
    matchLabels:
      app: media-svc
  template:
    metadata:
      labels:
        app: media-svc
    spec:
      containers:
        - name: media-svc
          image: openhack/media-svc:latest
          imagePullPolicy: Never
          envFrom:
            - configMapRef:
                name: openhack-config
          env:
            - name: DATABASE_URL
              value: "postgresql://$(POSTGRES_USER):$(DATABASE_PASSWORD)@$(POSTGRES_HOST):$(POSTGRES_PORT)/$(POSTGRES_DB)"
            - name: STORAGE_PROVIDER
              value: "minio"
            - name: S3_ENDPOINT_URL
              value: "http://minio:9000"
            - name: S3_BUCKET_NAME
              value: "openhack-media"
            - name: AWS_ACCESS_KEY_ID
              value: "minioadmin"
            - name: AWS_SECRET_ACCESS_KEY
              value: "minioadmin"
            - name: SERVICE_PORT
              value: "3010"
          ports:
            - containerPort: 3010
          volumeMounts:
            - name: uploads
              mountPath: /app/uploads
          resources:
            requests:
              memory: 64Mi
              cpu: 50m
            limits:
              memory: 128Mi
              cpu: 200m
          readinessProbe:
            httpGet:
              path: /health
              port: 3010
            initialDelaySeconds: 15
            periodSeconds: 10
      volumes:
        - name: uploads
          persistentVolumeClaim:
            claimName: media-uploads
---
apiVersion: v1
kind: Service
metadata:
  name: media-svc
  labels:
    openhack: "true"
spec:
  selector:
    app: media-svc
  ports:
    - name: http
      port: 3010
