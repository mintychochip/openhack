---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: auth-svc
spec:
  replicas: 1
  selector:
    matchLabels:
      app: auth-svc
  template:
    metadata:
      labels:
        app: auth-svc
    spec:
      containers:
        - name: auth-svc
          image: openhack/auth-svc:latest
          imagePullPolicy: Never
          envFrom:
            - configMapRef:
                name: openhack-config
            - secretRef:
                name: openhack-secrets
          env:
            - name: JWT_SECRET
              valueFrom:
                secretKeyRef:
                  name: openhack-secrets
                  key: jwt-secret
            - name: DATABASE_URL
              value: "postgresql://$(POSTGRES_USER):$(DATABASE_PASSWORD)@$(POSTGRES_HOST):$(POSTGRES_PORT)/$(POSTGRES_DB)"
            - name: SERVICE_PORT
              value: "3001"
          ports:
            - containerPort: 3001
          resources:
            requests:
              memory: 64Mi
              cpu: 50m
            limits:
              memory: 128Mi
              cpu: 200m
          readinessProbe:
            httpGet:
              path: /health
              port: 3001
            initialDelaySeconds: 15
            periodSeconds: 10
---
apiVersion: v1
kind: Service
metadata:
  name: auth-svc
  labels:
    openhack: "true"
spec:
  selector:
    app: auth-svc
  ports:
    - name: http
      port: 3001
