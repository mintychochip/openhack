[workspace]
resolver = "2"
members = [
    "services/openhack-common",
    "services/auth-rust",
    "services/core-rust",
    "services/gateway-rust",
    "services/judging-rust",
    "services/leaderboard",
    "services/ai-rust",
    "services/analytics-rust",
    "services/mail-rust",
    "services/media-rust",
    "services/notify-rust",
    "services/sponsors-rust",
    "services/discord-bot-rust",
    "cli-rust",
]

[workspace.dependencies]
openhack-common = { path = "services/openhack-common" }
actix-web = "4"
actix-rt = "2"
actix-cors = "0.7"
sqlx = { version = "0.7", features = ["runtime-tokio", "postgres", "uuid", "chrono", "json", "rust_decimal"] }
redis = { version = "0.24", features = ["tokio-comp"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
uuid = { version = "1", features = ["v4", "serde"] }
chrono = { version = "0.4", features = ["serde"] }
dotenvy = "0.15"
env_logger = "0.10"
log = "0.4"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "signal", "time"] }
thiserror = "1.0"
jsonwebtoken = "9"

[profile.release]
lto = true
codegen-units = 1
strip = true
opt-level = "s"
panic = "abort"
