apiVersion: external-secrets.io/v1beta1
kind: SecretStore
metadata:
  name: aws-secretsmanager
  namespace: openhack
spec:
  provider:
    aws:
      service: SecretsManager
      region: us-east-1
      auth:
        jwt:
          serviceAccountRef:
            name: external-secrets-sa
---
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: openhack-secrets
  namespace: openhack
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: aws-secretsmanager
    kind: SecretStore
  target:
    name: openhack-secrets
    creationPolicy: Owner
  data:
    - secretKey: jwt-secret
      remoteRef:
        key: openhack/jwt-secret
    - secretKey: database-password
      remoteRef:
        key: openhack/database-password
    - secretKey: redis-password
      remoteRef:
        key: openhack/redis-password
    - secretKey: smtp-password
      remoteRef:
        key: openhack/smtp-password
    - secretKey: minio-root-password
      remoteRef:
        key: openhack/minio-root-password
