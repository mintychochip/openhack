{{- if not .Values.secrets.useExternalSecrets }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "openhack.fullname" . }}-secrets
  labels:
    {{- include "openhack.labels" . | nindent 4 }}
type: Opaque
stringData:
  {{- if .Values.secrets.jwtSecret }}
  jwt-secret: {{ .Values.secrets.jwtSecret | quote }}
  {{- else }}
  jwt-secret: {{ randAlphaNum 32 | quote }}
  {{- end }}
  {{- if .Values.secrets.databasePassword }}
  database-password: {{ .Values.secrets.databasePassword | quote }}
  {{- else }}
  database-password: {{ randAlphaNum 32 | quote }}
  {{- end }}
  {{- if .Values.secrets.redisPassword }}
  redis-password: {{ .Values.secrets.redisPassword | quote }}
  {{- else }}
  redis-password: {{ randAlphaNum 32 | quote }}
  {{- end }}
{{- end }}
  
  {{- if .Values.secrets.databasePassword }}
  database-password: {{ .Values.secrets.databasePassword | quote }}
  {{- else }}
  database-password: {{ randAlphaNum 16 | quote }}
  {{- end }}
  
  {{- if .Values.secrets.redisPassword }}
  redis-password: {{ .Values.secrets.redisPassword | quote }}
  {{- else }}
  redis-password: {{ randAlphaNum 16 | quote }}
  {{- end }}
