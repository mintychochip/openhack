# Discord Bot Service Deployment
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ $fullName }}-discord-bot-svc
  labels:
    {{- $labels | nindent 4 }}
    app.kubernetes.io/component: discord-bot-svc
spec:
  replicas: {{ .Values.discordBotService.replicaCount | default 1 }}
  selector:
    matchLabels:
      {{- $labels | nindent 6 }}
      app.kubernetes.io/component: discord-bot-svc
  template:
    metadata:
      labels:
        {{- $labels | nindent 8 }}
        app.kubernetes.io/component: discord-bot-svc
    spec:
      containers:
        - name: discord-bot-svc
          image: "{{ .Values.discordBotService.image.repository }}:{{ .Values.discordBotService.image.tag | default .Values.global.imageTag | default "latest" }}"
          imagePullPolicy: {{ .Values.discordBotService.image.pullPolicy | default "IfNotPresent" }}
          ports:
            - name: http
              containerPort: 3011
              protocol: TCP
          resources:
            requests:
              memory: {{ .Values.discordBotService.resources.requests.memory | default "128Mi" }}
              cpu: {{ .Values.discordBotService.resources.requests.cpu | default "50m" }}
            limits:
              memory: {{ .Values.discordBotService.resources.limits.memory | default "256Mi" }}
              cpu: {{ .Values.discordBotService.resources.limits.cpu | default "200m" }}
          envFrom:
            - configMapRef:
                name: {{ $fullName }}-config
          livenessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 30
            periodSeconds: 10
          readinessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 5
            periodSeconds: 5
---
# Frontend Deployment
{{- if .Values.frontend.enabled }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ $fullName }}-web
  labels:
    {{- $labels | nindent 4 }}
    app.kubernetes.io/component: web
spec:
  replicas: {{ .Values.frontend.replicaCount }}
  selector:
    matchLabels:
      {{- $labels | nindent 6 }}
      app.kubernetes.io/component: web
  template:
    metadata:
      labels:
        {{- $labels | nindent 8 }}
        app.kubernetes.io/component: web
    spec:
      containers:
        - name: web
          image: "{{ .Values.frontend.image.repository }}:{{ .Values.frontend.image.tag }}"
          imagePullPolicy: {{ .Values.frontend.image.pullPolicy }}
          ports:
            - name: http
              containerPort: 3000
              protocol: TCP
          env:
            - name: NEXT_PUBLIC_API_URL
              valueFrom:
                configMapKeyRef:
                  name: {{ $fullName }}-config
                  key: NEXT_PUBLIC_API_URL
          livenessProbe:
            httpGet:
              path: /
              port: http
            initialDelaySeconds: 10
            periodSeconds: 10
          readinessProbe:
            httpGet:
              path: /
              port: http
            initialDelaySeconds: 5
            periodSeconds: 5
          resources:
            {{- toYaml .Values.frontend.resources | nindent 12 }}
{{- end }}
