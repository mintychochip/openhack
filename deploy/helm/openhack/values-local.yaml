global:
  imageRegistry: ""
  imagePullSecrets: []
  storageClass: standard
  security:
    allowInsecureImages: true

postgresql:
  enabled: true
  image:
    repository: pgvector/pgvector
    tag: pg16
    pullPolicy: IfNotPresent
  auth:
    username: openhack
    database: openhack
    password: openhack_pass
  primary:
    persistence:
      enabled: true
      size: 2Gi
      storageClass: standard
    resources:
      requests:
        memory: 192Mi
        cpu: 100m
      limits:
        memory: 384Mi
        cpu: 500m
  volumePermissions:
    enabled: true

redis:
  enabled: true
  architecture: standalone
  auth:
    enabled: false
  master:
    persistence:
      enabled: true
      size: 1Gi
      storageClass: standard
    resources:
      requests:
        memory: 64Mi
        cpu: 50m
      limits:
        memory: 128Mi
        cpu: 200m

minio:
  enabled: true
  auth:
    rootUser: minioadmin
    rootPassword: minioadmin
  persistence:
    enabled: true
    size: 5Gi
    storageClass: standard
  resources:
    requests:
      memory: 128Mi
      cpu: 50m
    limits:
      memory: 256Mi
      cpu: 250m
  defaultBuckets: "openhack-media"

gateway:
  enabled: true
  image:
    repository: openhack/gateway-svc
    tag: latest
    pullPolicy: Never
  replicaCount: 1
  port: 8000
  resources:
    requests:
      memory: 64Mi
      cpu: 50m
    limits:
      memory: 192Mi
      cpu: 250m
  ingress:
    enabled: true
    className: nginx
    annotations:
      nginx.ingress.kubernetes.io/rewrite-target: /
    hosts:
      - host: openhack.local
        paths:
          - path: /
            pathType: Prefix
    tls: []

authService:
  replicaCount: 1
  image:
    repository: openhack/auth-svc
    tag: latest
    pullPolicy: Never
  port: 3001
  resources:
    requests:
      memory: 64Mi
      cpu: 50m
    limits:
      memory: 128Mi
      cpu: 200m
  config:
    jwtSecret: "local-dev-jwt-secret-change-in-production-32ch"
    jwtExpiry: "15m"
    refreshTokenExpiry: "7d"
    oauth:
      github:
        clientId: ""
        clientSecret: ""
      google:
        clientId: ""
        clientSecret: ""
      discord:
        clientId: ""
        clientSecret: ""

coreService:
  replicaCount: 1
  image:
    repository: openhack/core-svc
    tag: latest
    pullPolicy: Never
  port: 3002
  resources:
    requests:
      memory: 64Mi
      cpu: 50m
    limits:
      memory: 128Mi
      cpu: 200m

judgingService:
  replicaCount: 1
  image:
    repository: openhack/judging-svc
    tag: latest
    pullPolicy: Never
  port: 3003
  resources:
    requests:
      memory: 64Mi
      cpu: 50m
    limits:
      memory: 128Mi
      cpu: 200m

leaderboardService:
  replicaCount: 1
  image:
    repository: openhack/leaderboard-svc
    tag: latest
    pullPolicy: Never
  port: 3004
  resources:
    requests:
      memory: 64Mi
      cpu: 50m
    limits:
      memory: 128Mi
      cpu: 200m

mailService:
  replicaCount: 1
  image:
    repository: openhack/mail-svc
    tag: latest
    pullPolicy: Never
  port: 3005
  resources:
    requests:
      memory: 64Mi
      cpu: 50m
    limits:
      memory: 128Mi
      cpu: 200m
  config:
    smtp:
      host: ""
      port: 587
      user: ""
      password: ""

notifyService:
  replicaCount: 1
  image:
    repository: openhack/notify-svc
    tag: latest
    pullPolicy: Never
  port: 3006
  resources:
    requests:
      memory: 64Mi
      cpu: 50m
    limits:
      memory: 128Mi
      cpu: 200m

aiService:
  replicaCount: 1
  image:
    repository: openhack/ai-svc
    tag: latest
    pullPolicy: Never
  port: 3007
  resources:
    requests:
      memory: 128Mi
      cpu: 100m
    limits:
      memory: 256Mi
      cpu: 500m
  config:
    llmProvider: "openai"
    openaiApiKey: ""
    anthropicApiKey: ""

analyticsService:
  replicaCount: 1
  image:
    repository: openhack/analytics-svc
    tag: latest
    pullPolicy: Never
  port: 3008
  resources:
    requests:
      memory: 64Mi
      cpu: 50m
    limits:
      memory: 128Mi
      cpu: 200m

sponsorsService:
  replicaCount: 1
  image:
    repository: openhack/sponsors-svc
    tag: latest
    pullPolicy: Never
  port: 3009
  resources:
    requests:
      memory: 64Mi
      cpu: 50m
    limits:
      memory: 128Mi
      cpu: 200m

mediaService:
  replicaCount: 1
  image:
    repository: openhack/media-svc
    tag: latest
    pullPolicy: Never
  port: 3010
  resources:
    requests:
      memory: 64Mi
      cpu: 50m
    limits:
      memory: 128Mi
      cpu: 200m
  storage:
    provider: "minio"
    s3:
      endpoint: ""
      bucket: "openhack-media"
      accessKey: "minioadmin"
      secretKey: "minioadmin"

discordBotService:
  replicaCount: 1
  image:
    repository: openhack/discord-bot-svc
    tag: latest
    pullPolicy: Never
  port: 3011
  resources:
    requests:
      memory: 64Mi
      cpu: 50m
    limits:
      memory: 128Mi
      cpu: 200m

frontend:
  enabled: true
  replicaCount: 1
  image:
    repository: openhack/web
    tag: latest
    pullPolicy: Never
  port: 3000
  resources:
    requests:
      memory: 64Mi
      cpu: 50m
    limits:
      memory: 256Mi
      cpu: 200m
  config:
    apiUrl: "http://openhack-gateway:8000"

monitoring:
  enabled: false
  prometheus:
    enabled: false
  grafana:
    enabled: false

ingress:
  enabled: true
  className: nginx
  annotations:
    nginx.ingress.kubernetes.io/proxy-body-size: "100m"
    nginx.ingress.kubernetes.io/proxy-read-timeout: "60"
    nginx.ingress.kubernetes.io/proxy-send-timeout: "60"
  hosts:
    - host: openhack.local
      paths:
        - path: /
          pathType: Prefix
  tls: []

secrets:
  create: true
  jwtSecret: "local-dev-jwt-secret-change-in-production-32ch"
  databasePassword: "openhack_pass"
  redisPassword: ""

resourceQuotas:
  enabled: false

networkPolicies:
  enabled: false

backup:
  enabled: false
