# Default configuration values for OpenHack Helm Chart

# Global settings
global:
  imageRegistry: ""
  imagePullSecrets: []
  storageClass: ""

# PostgreSQL Configuration
postgresql:
  enabled: true
  image:
    repository: pgvector/pgvector
    tag: pg16
  auth:
    username: openhack
    database: openhack
    existingSecret: ""
    secretKeys:
      userPasswordKey: password
  primary:
    persistence:
      enabled: true
      size: 10Gi
    resources:
      requests:
        memory: 256Mi
        cpu: 100m
      limits:
        memory: 512Mi
        cpu: 500m

# Redis Configuration
redis:
  enabled: true
  image:
    repository: redis
    tag: 7-alpine
  architecture: standalone
  auth:
    enabled: false
  master:
    persistence:
      enabled: true
      size: 5Gi
    resources:
      requests:
        memory: 128Mi
        cpu: 50m
      limits:
        memory: 256Mi
        cpu: 200m

# MinIO Configuration (for media storage)
minio:
  enabled: true
  image:
    repository: minio/minio
    tag: latest
  rootUser: minioadmin
  rootPassword: minioadmin
  buckets:
    - name: openhack-media
  persistence:
    enabled: true
    size: 20Gi
  resources:
    requests:
      memory: 256Mi
      cpu: 100m
    limits:
      memory: 512Mi
      cpu: 500m

# Gateway Service Configuration (Rust gateway)
gateway:
  enabled: true
  image:
    repository: openhack/gateway-svc
    tag: latest
    pullPolicy: IfNotPresent
  replicaCount: 2
  port: 8000
  resources:
    requests:
      memory: 256Mi
      cpu: 100m
    limits:
      memory: 512Mi
      cpu: 500m
  ingress:
    enabled: true
    className: nginx
    annotations:
      nginx.ingress.kubernetes.io/rewrite-target: /
    hosts:
      - host: openhack.local
        paths:
          - path: /
            pathType: Prefix
    tls: []

# Auth Service Configuration
authService:
  replicaCount: 2
  image:
    repository: openhack/auth-svc
    tag: latest
    pullPolicy: IfNotPresent
  port: 3001
  resources:
    requests:
      memory: 128Mi
      cpu: 50m
    limits:
      memory: 256Mi
      cpu: 200m
  config:
    jwtSecret: ""  # Should be set via secret
    jwtExpiry: "15m"
    refreshTokenExpiry: "7d"
    oauth:
      github:
        clientId: ""
        clientSecret: ""
      google:
        clientId: ""
        clientSecret: ""
      discord:
        clientId: ""
        clientSecret: ""

# Core Service Configuration
coreService:
  replicaCount: 2
  image:
    repository: openhack/core-svc
    tag: latest
    pullPolicy: IfNotPresent
  port: 3002
  resources:
    requests:
      memory: 128Mi
      cpu: 50m
    limits:
      memory: 256Mi
      cpu: 200m

# Judging Service Configuration
judgingService:
  replicaCount: 2
  image:
    repository: openhack/judging-svc
    tag: latest
    pullPolicy: IfNotPresent
  port: 3003
  resources:
    requests:
      memory: 128Mi
      cpu: 50m
    limits:
      memory: 256Mi
      cpu: 200m

# Leaderboard Service Configuration
leaderboardService:
  replicaCount: 2
  image:
    repository: openhack/leaderboard-svc
    tag: latest
    pullPolicy: IfNotPresent
  port: 3004
  resources:
    requests:
      memory: 128Mi
      cpu: 50m
    limits:
      memory: 256Mi
      cpu: 200m

# Mail Service Configuration
mailService:
  replicaCount: 1
  image:
    repository: openhack/mail-svc
    tag: latest
    pullPolicy: IfNotPresent
  port: 3005
  resources:
    requests:
      memory: 128Mi
      cpu: 50m
    limits:
      memory: 256Mi
      cpu: 200m
  config:
    smtp:
      host: ""
      port: 587
      user: ""
      password: ""

# Notification Service Configuration
notifyService:
  replicaCount: 1
  image:
    repository: openhack/notify-svc
    tag: latest
    pullPolicy: IfNotPresent
  port: 3006
  resources:
    requests:
      memory: 128Mi
      cpu: 50m
    limits:
      memory: 256Mi
      cpu: 200m

# AI Service Configuration
aiService:
  replicaCount: 1
  image:
    repository: openhack/ai-svc
    tag: latest
    pullPolicy: IfNotPresent
  port: 3007
  resources:
    requests:
      memory: 512Mi
      cpu: 200m
    limits:
      memory: 1Gi
      cpu: 500m
  config:
    llmProvider: "openai"
    openaiApiKey: ""
    anthropicApiKey: ""

# Analytics Service Configuration
analyticsService:
  replicaCount: 1
  image:
    repository: openhack/analytics-svc
    tag: latest
    pullPolicy: IfNotPresent
  port: 3008
  resources:
    requests:
      memory: 256Mi
      cpu: 100m
    limits:
      memory: 512Mi
      cpu: 300m

# Sponsors Service Configuration
sponsorsService:
  replicaCount: 1
  image:
    repository: openhack/sponsors-svc
    tag: latest
    pullPolicy: IfNotPresent
  port: 3009
  resources:
    requests:
      memory: 128Mi
      cpu: 50m
    limits:
      memory: 256Mi
      cpu: 200m

# Media Service Configuration
mediaService:
  replicaCount: 2
  image:
    repository: openhack/media-svc
    tag: latest
    pullPolicy: IfNotPresent
  port: 3010
  resources:
    requests:
      memory: 128Mi
      cpu: 50m
    limits:
      memory: 256Mi
      cpu: 200m
  storage:
    provider: "minio"  # local, minio, s3
    s3:
      endpoint: ""
      bucket: "openhack-media"
      accessKey: ""
      secretKey: ""

# Discord Bot Service Configuration
discordBotService:
  replicaCount: 1
  image:
    repository: openhack/discord-bot-svc
    tag: latest
    pullPolicy: IfNotPresent
  port: 3011
  resources:
    requests:
      memory: 128Mi
      cpu: 50m
    limits:
      memory: 256Mi
      cpu: 200m

# Frontend Configuration
frontend:
  enabled: true
  replicaCount: 2
  image:
    repository: openhack/web
    tag: latest
    pullPolicy: IfNotPresent
  port: 3000
  resources:
    requests:
      memory: 128Mi
      cpu: 50m
    limits:
      memory: 256Mi
      cpu: 200m
  config:
    apiUrl: "http://gateway:8000"

# Monitoring Configuration
monitoring:
  enabled: false
  prometheus:
    enabled: false
  grafana:
    enabled: false

# Ingress Configuration
ingress:
  enabled: true
  className: nginx
  annotations:
    nginx.ingress.kubernetes.io/proxy-body-size: "100m"
    nginx.ingress.kubernetes.io/proxy-read-timeout: "60"
    nginx.ingress.kubernetes.io/proxy-send-timeout: "60"
  hosts:
    - host: openhack.local
      paths:
        - path: /
          pathType: Prefix
  tls: []
  #  - secretName: openhack-tls
  #    hosts:
  #      - openhack.local

# Secret Management
secrets:
  create: true
  useExternalSecrets: false  # Set to true to use AWS Secrets Manager via External Secrets Operator
  jwtSecret: ""
  databasePassword: ""
  redisPassword: ""

# Resource Quotas
resourceQuotas:
  enabled: false
  requests:
    cpu: "4"
    memory: "8Gi"
  limits:
    cpu: "8"
    memory: "16Gi"

# Autoscaling Configuration
autoscaling:
  enabled: true

authService:
  autoscaling:
    minReplicas: 2
    maxReplicas: 10
    targetCPUUtilizationPercentage: 70
    targetMemoryUtilizationPercentage: 80

coreService:
  autoscaling:
    minReplicas: 2
    maxReplicas: 10
    targetCPUUtilizationPercentage: 70

gatewayService:
  autoscaling:
    minReplicas: 3
    maxReplicas: 20
    targetCPUUtilizationPercentage: 60

judgingService:
  autoscaling:
    minReplicas: 2
    maxReplicas: 10
    targetCPUUtilizationPercentage: 70

leaderboardService:
  autoscaling:
    minReplicas: 2
    maxReplicas: 10
    targetCPUUtilizationPercentage: 70

mailService:
  autoscaling:
    minReplicas: 2
    maxReplicas: 5
    targetCPUUtilizationPercentage: 70

# Pod Disruption Budget
podDisruptionBudget:
  enabled: true
  minAvailable: 1
  # maxUnavailable: 1  # Use this instead of minAvailable if preferred

# Network Policies
networkPolicies:
  enabled: true

# Database Migration Job
migrationJob:
  image:
    repository: pgvector/pgvector
    tag: pg16
    pullPolicy: IfNotPresent
  resources:
    requests:
      cpu: 100m
      memory: 128Mi
    limits:
      cpu: 500m
      memory: 512Mi

# Backup Configuration
backup:
  enabled: false
  schedule: "0 2 * * *"  # Daily at 2 AM
  retention:
    daily: 7
    weekly: 4
    monthly: 12
  storage:
    type: "s3"  # s3, gcs, azure
    bucket: ""
    region: ""
