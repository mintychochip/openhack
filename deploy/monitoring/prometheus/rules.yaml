apiVersion: monitoring.coreos.com/v1
kind: PrometheusRule
metadata:
  name: openhack-alerts
  namespace: default
  labels:
    app: openhack
    release: monitoring
spec:
  groups:
    - name: openhack-critical
      interval: 30s
      rules:
        - alert: Watchdog
          expr: vector(1)
          for: 0m
          labels:
            severity: none
          annotations:
            summary: "Alerting pipeline health check"
            description: "This alert always fires. If you receive this notification, the alerting pipeline is working."

        - alert: ServiceDown
          expr: up{job="openhack-services"} == 0
          for: 2m
          labels:
            severity: critical
          annotations:
            summary: "Service {{ $labels.instance }} is down"
            description: "{{ $labels.instance }} has been down for more than 2 minutes."

        - alert: HighErrorRate
          expr: |
            sum(rate(http_requests_failed[5m]))
            / sum(rate(http_requests_total[5m])) * 100 > 10
          for: 5m
          labels:
            severity: critical
          annotations:
            summary: "High error rate detected"
            description: "Error rate is {{ $value | printf \"%.1f\" }}% (threshold: 10%). Note: 'failed' = all HTTP >=400 status codes."

        - alert: DiskFull
          expr: node_filesystem_avail_bytes / node_filesystem_size_bytes * 100 < 5
          for: 5m
          labels:
            severity: critical
          annotations:
            summary: "Disk is almost full on {{ $labels.instance }}"
            description: "Available disk space on {{ $labels.mountpoint }} is {{ $value | printf \"%.1f\" }}% (threshold: 5%)"

        - alert: DatabaseDown
          expr: pg_up == 0
          for: 1m
          labels:
            severity: critical
          annotations:
            summary: "PostgreSQL database is down"
            description: "PostgreSQL has been unreachable for more than 1 minute."

        - alert: RedisDown
          expr: redis_up == 0
          for: 1m
          labels:
            severity: critical
          annotations:
            summary: "Redis cache is down"
            description: "Redis has been unreachable for more than 1 minute."

    - name: openhack-warning
      interval: 30s
      rules:
        - alert: HighMemory
          expr: |
            container_memory_working_set_bytes / container_spec_memory_limit_bytes > 0.8
            and container_spec_memory_limit_bytes > 0
          for: 10m
          labels:
            severity: warning
          annotations:
            summary: "High memory usage for {{ $labels.pod }}"
            description: "Memory usage is {{ $value | printf \"%.0f\" }}% (threshold: 80%)"

        - alert: HighCPU
          expr: |
            rate(container_cpu_usage_seconds_total[5m]) * 100 > 80
          for: 10m
          labels:
            severity: warning
          annotations:
            summary: "High CPU usage for {{ $labels.pod }}"
            description: "CPU usage is {{ $value | printf \"%.0f\" }}% (threshold: 80%)"

        - alert: PodCrashLooping
          expr: rate(kube_pod_container_status_restarts_total[15m]) * 60 * 5 > 0
          for: 5m
          labels:
            severity: warning
          annotations:
            summary: "Pod {{ $labels.pod }} is crash-looping"
            description: "{{ $labels.pod }} has restarted {{ $value | printf \"%.0f\" }} times in the last 15 minutes."

        - alert: HighLatency
          expr: |
            histogram_quantile(0.99, sum(rate(http_request_duration_seconds_bucket[5m])) by (le, service)) > 2
          for: 10m
          labels:
            severity: warning
          annotations:
            summary: "High p99 latency on {{ $labels.service }}"
            description: "p99 latency is {{ $value | printf \"%.2f\" }}s (threshold: 2s)"

        - alert: SlowQueries
          expr: pg_stat_statements_mean_exec_seconds > 1
          for: 10m
          labels:
            severity: warning
          annotations:
            summary: "Slow database queries detected"
            description: "Average query execution time is {{ $value | printf \"%.2f\" }}s (threshold: 1s)"

        - alert: CacheHitRateLow
          expr: |
            redis_keyspace_hits_total / (redis_keyspace_hits_total + redis_keyspace_misses_total) < 0.8
            and redis_keyspace_hits_total > 0
          for: 30m
          labels:
            severity: warning
          annotations:
            summary: "Redis cache hit rate is low"
            description: "Cache hit rate is {{ $value | printf \"%.1f\" }}% (threshold: 80%)"

    - name: openhack-info
      interval: 30s
      rules:
        - alert: DiskUsageHigh
          expr: node_filesystem_avail_bytes / node_filesystem_size_bytes * 100 < 30
          for: 1h
          labels:
            severity: info
          annotations:
            summary: "Disk usage above 70% on {{ $labels.instance }}"
            description: "Available disk space on {{ $labels.mountpoint }} is {{ $value | printf \"%.1f\" }}%"

        - alert: DeploymentReplicasMismatch
          expr: |
            kube_deployment_status_replicas != kube_deployment_spec_replicas
          for: 15m
          labels:
            severity: info
          annotations:
            summary: "Deployment {{ $labels.deployment }} has replica mismatch"
            description: "{{ $labels.deployment }} has {{ $value }} ready replicas but spec requires different count."

        - alert: CertificateExpiringSoon
          expr: probe_ssl_earliest_cert_expiry - time() < 30 * 24 * 3600
          for: 1h
          labels:
            severity: info
          annotations:
            summary: "SSL certificate expiring soon"
            description: "SSL certificate for {{ $labels.instance }} expires in {{ $value | humanizeDuration }}."
