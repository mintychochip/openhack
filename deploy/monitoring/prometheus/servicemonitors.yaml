apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: openhack-gateway
  namespace: openhack
  labels:
    app: openhack
    component: gateway
spec:
  selector:
    matchLabels:
      app: openhack-gateway
  endpoints:
    - port: http
      path: /metrics
      interval: 30s
      scrapeTimeout: 10s
---
