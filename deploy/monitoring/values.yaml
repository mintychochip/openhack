# Monitoring Stack Configuration
# Optional - disabled by default

# Enable monitoring stack
enabled: false

# Prometheus configuration
prometheus:
  enabled: true
  retention: 15d
  storage:
    enabled: true
    size: 50Gi
    storageClass: ""
  resources:
    requests:
      memory: 512Mi
      cpu: 250m
    limits:
      memory: 2Gi
      cpu: 1000m
  serviceMonitor:
    enabled: true
    interval: 30s
    scrapeTimeout: 10s

# Grafana configuration
grafana:
  enabled: true
  adminPassword: ""  # Auto-generated if empty
  persistence:
    enabled: true
    size: 10Gi
  resources:
    requests:
      memory: 256Mi
      cpu: 100m
    limits:
      memory: 1Gi
      cpu: 500m
  dashboardProviders:
    dashboardproviders.yaml:
      providers:
        - provider: default
          folder: OpenHack
          type: file
          options:
            path: /var/lib/grafana/dashboards/default
  dashboards:
    default:
      overview:
        gnetId: null
        revision: 1
        datasource: Prometheus
        json: ../grafana/overview.json
      services:
        gnetId: null
        revision: 1
        datasource: Prometheus
        json: ../grafana/services.json
      database:
        gnetId: null
        revision: 1
        datasource: Prometheus
        json: ../grafana/database.json
      business:
        gnetId: null
        revision: 1
        datasource: Prometheus
        json: ../grafana/business.json

# Alertmanager configuration
alertmanager:
  enabled: true
  persistence:
    enabled: true
    size: 2Gi
  resources:
    requests:
      memory: 128Mi
      cpu: 50m
    limits:
      memory: 256Mi
      cpu: 100m
  config:
    global:
      resolve_timeout: 5m
      smtp_smarthost: 'smtp.example.com:587'
      smtp_from: 'alertmanager@example.com'
    route:
      group_by: ['alertname', 'severity']
      group_wait: 10s
      group_interval: 10s
      repeat_interval: 1h
      receiver: 'slack-notifications'
      routes:
        - match:
            severity: critical
          receiver: 'pagerduty'
        - match:
            severity: warning
          receiver: 'slack-notifications'
    receivers:
      - name: 'slack-notifications'
        slack_configs:
          - api_url: 'https://hooks.slack.com/services/YOUR/WEBHOOK/URL'
            channel: '#alerts'
            send_resolved: true
      - name: 'pagerduty'
        pagerduty_configs:
          - service_key: 'YOUR_PAGERDUTY_KEY'

# Node exporter (for infrastructure metrics)
nodeExporter:
  enabled: true
  resources:
    requests:
      memory: 64Mi
      cpu: 50m
    limits:
      memory: 128Mi
      cpu: 100m

# Kube-state-metrics (for Kubernetes metrics)
kubeStateMetrics:
  enabled: true
  resources:
    requests:
      memory: 128Mi
      cpu: 50m
    limits:
      memory: 256Mi
      cpu: 100m
